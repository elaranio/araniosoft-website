<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>ZeroBudget — Ayúdanos a mejorar</title>
    <style>
        :root {
            --bg: #FAFAFA;
            --card: #FFFFFF;
            --text: #1A1A1A;
            --muted: #6B7280;
            --accent: #10B981;
            --border: #E5E7EB;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #111111;
                --card: #1C1C1E;
                --text: #F5F5F5;
                --muted: #9CA3AF;
                --accent: #34D399;
                --border: #2D2D2D;
            }
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
            padding: 2rem 1rem;
        }
        .container {
            max-width: 560px;
            margin: 2rem auto;
            background: var(--card);
            border-radius: 16px;
            border: 1px solid var(--border);
            padding: 2.5rem 2rem;
            text-align: center;
        }
        .logo span {
            font-size: 2rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--accent), #059669);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        h1 { font-size: 1.5rem; margin: 1rem 0 0.75rem; }
        p { color: var(--muted); margin-bottom: 1.5rem; }
        .btn {
            display: inline-block;
            background: var(--accent);
            color: #06251B;
            font-weight: 600;
            text-decoration: none;
            padding: 0.85rem 1.6rem;
            border-radius: 12px;
        }
        .alt { margin-top: 1.5rem; font-size: 0.9rem; }
        .alt a { color: var(--accent); }
        [hidden] { display: none !important; }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo"><span>ZeroBudget</span></div>
        <h1 id="title"></h1>
        <p id="intro"></p>
        <a id="formBtn" class="btn" hidden></a>
        <a id="mailBtn" class="btn" hidden></a>
        <p class="alt" id="alt" hidden></p>
    </div>

    <script>
    // 22-oct-2026. La app abre esta página con ?lang=es|pt|en y esta lleva al formulario de ese idioma.
    // Sirve para cambiar el formulario SIN una versión nueva de la app: basta editar FORMS.
    // Mientras un idioma no tenga formulario (cadena vacía) se ofrece escribir por correo.
    var FORMS = { es: "", pt: "", en: "" };

    var T = {
        es: { title: "Ayúdanos a mejorar ZeroBudget",
              intro: "Tus datos financieros nunca salen de tu iPhone, y esta encuesta tampoco te pide ninguno. Son unos 3 minutos y leo cada respuesta personalmente.",
              form: "Abrir la encuesta", mail: "Escríbenos un correo",
              alt: "¿Prefieres escribirnos? <a href=\"mailto:soporte@araniosoft.com?subject=ZeroBudget%20-%20Ayúdanos%20a%20mejorar\">soporte@araniosoft.com</a>",
              subject: "ZeroBudget - Ayúdanos a mejorar",
              body: "1) ¿Qué fue lo más difícil o confuso?\n\n2) ¿Qué te falta o qué cambiarías?\n\n3) Si no eres Pro, ¿qué te frena?\n" },
        pt: { title: "Ajude a melhorar o ZeroBudget",
              intro: "Seus dados financeiros nunca saem do seu iPhone, e esta pesquisa também não pede nenhum. Leva cerca de 3 minutos e eu leio cada resposta pessoalmente.",
              form: "Abrir a pesquisa", mail: "Escreva-nos um e-mail",
              alt: "Prefere nos escrever? <a href=\"mailto:soporte@araniosoft.com?subject=ZeroBudget%20-%20Ajude%20a%20melhorar\">soporte@araniosoft.com</a>",
              subject: "ZeroBudget - Ajude a melhorar",
              body: "1) O que foi mais difícil ou confuso?\n\n2) O que falta ou o que você mudaria?\n\n3) Se você não é Pro, o que te impede?\n" },
        en: { title: "Help us improve ZeroBudget",
              intro: "Your financial data never leaves your iPhone, and this survey doesn't ask for any. It takes about 3 minutes and I read every answer myself.",
              form: "Open the survey", mail: "Send us an email",
              alt: "Prefer to write to us? <a href=\"mailto:soporte@araniosoft.com?subject=ZeroBudget%20-%20Help%20us%20improve\">soporte@araniosoft.com</a>",
              subject: "ZeroBudget - Help us improve",
              body: "1) What was hardest or most confusing?\n\n2) What's missing, or what would you change?\n\n3) If you're not on Pro, what holds you back?\n" }
    };

    var q = new URLSearchParams(location.search).get("lang");
    var nav = (navigator.language || "en").toLowerCase().slice(0, 2);
    // Con ?lang= manda el parámetro (un idioma sin formulario cae a inglés); sin él, el del navegador.
    var lang = q ? (T[q] ? q : "en") : (T[nav] ? nav : "en");
    var t = T[lang];

    document.documentElement.lang = lang;
    document.title = "ZeroBudget — " + t.title;
    document.getElementById("title").textContent = t.title;
    document.getElementById("intro").textContent = t.intro;

    var form = FORMS[lang];
    if (form) {
        var b = document.getElementById("formBtn");
        b.href = form; b.textContent = t.form; b.hidden = false;
        var alt = document.getElementById("alt");
        alt.innerHTML = t.alt; alt.hidden = false;
        // Quien viene de la app va directo al formulario; el botón queda por si no redirige.
        window.location.replace(form);
    } else {
        var m = document.getElementById("mailBtn");
        m.href = "mailto:soporte@araniosoft.com?subject=" + encodeURIComponent(t.subject) + "&body=" + encodeURIComponent(t.body);
        m.textContent = t.mail; m.hidden = false;
    }
    </script>
</body>
</html>
